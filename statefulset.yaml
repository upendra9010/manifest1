apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mystatefulset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: dbcontainer
        image: upendra9010/hockton:dbimage
        ports:
        - containerPort: 80
        envFrom:                    # Fixed: changed from "envfrom" to "envFrom"
        - secretRef:
            name: mysecret
        volumeMounts:               # Fixed: changed from "volumesMounts" to "volumeMounts"
        - name: dbvolume
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:             # Moved: this should be at StatefulSet spec level, not container level
  - metadata:
      name: dbvolume
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
