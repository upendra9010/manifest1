apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mystatefulset
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: dbcontainer
        image: upendra9010/hockton:dbimage
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: mysecret
        volumeMounts:
        - name: dbvolume
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
  volumeClaimTemplates:
  - metadata:
      name: dbvolume
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp2  # FIX: This enables dynamic provisioning
      resources:
        requests:
          storage: 2Gi
