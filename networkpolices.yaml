apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myntp
  namespace: default
  annotations:
    argocd.argoproj.io/tracking-id: myapp:networking.k8s.io/NetworkPolicy:default/myntp
spec:
  podSelector:
    matchLabels:
      role: myapp
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - port: 80
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - port: 3306
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
